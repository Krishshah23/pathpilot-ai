<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Dark ink squircle background -->
  <rect width="160" height="160" rx="38" fill="#0F172A"/>
  <!-- Subtle border -->
  <rect x="1" y="1" width="158" height="158" rx="37" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <!-- "P" lettermark in white -->
  <text
    x="50%"
    y="50%"
    dominant-baseline="central"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="96"
    font-weight="700"
    fill="white"
    letter-spacing="-2"
  >P</text>
  <!-- Emerald dot accent bottom-right -->
  <circle cx="118" cy="118" r="12" fill="#10B981"/>
</svg>
